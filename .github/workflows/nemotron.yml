name: Nemotron components

on:
  pull_request:
    paths:
      - '.github/workflows/nemotron.yml'
      - 'scripts/*nemotron*'
      - 'scripts/speaker_assets.py'
      - 'scripts/verify-speaker-release.py'
      - 'resources/nemotron/**'
      - 'electron/src/services/NemotronDiarizer*'
      - 'electron/src/services/SpeakerDiarizationService*'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-component:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: win-x64-cpu
            smoke_args: ''
          - os: windows-latest
            variant: win-x64-gpu
            smoke_args: ''
          - os: windows-2022
            variant: win-x64-cpu
            smoke_args: ''
          - os: windows-2022
            variant: win-x64-gpu
            smoke_args: ''
          - os: macos-15
            variant: mac-arm64
            # The hosted VM's paravirtualized Metal driver crashes upstream inference; physical Metal is a release gate.
            smoke_args: '--cpu-only'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare-nemotron.py ${{ matrix.variant }}
      - run: python scripts/verify-speaker-release.py build-assets/${{ matrix.variant }}/nemotron/component.json
      - run: python scripts/smoke-nemotron.py ${{ matrix.variant }} ${{ matrix.smoke_args }}
