name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: false

permissions:
  contents: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build-mac:
    needs: lint-and-typecheck
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the validated Whisper source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 30c5194c9691e4e9a98b3dea9f19727397d3f46e
          path: whisper.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build whisper.cpp (Metal) and prepare models
        run: npm run prebuild:assets:mac

      - name: Build and package
        run: npm run make:mac

      - name: Verify Nemotron release component
        run: python scripts/verify-speaker-release.py build-assets/mac-arm64/nemotron/component.json

      # The hosted VM's paravirtualized Metal driver crashes upstream inference; qualify Metal on a physical Mac.
      - name: Smoke test installed Nemotron on CPU
        run: python scripts/smoke-nemotron.py mac-arm64 --cpu-only

      - name: Upload Nemotron component
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-mac-arm64
          path: |
            build-assets/release-components/*.zip
            build-assets/release-components/*-component.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finelistener-mac-arm64
          path: out/make/**/*
          if-no-files-found: error

  build-win-gpu:
    needs: lint-and-typecheck
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the validated Whisper source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 30c5194c9691e4e9a98b3dea9f19727397d3f46e
          path: whisper.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: network

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.290.0
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build whisper.cpp (CUDA+Vulkan), miniaudio, and prepare models
        shell: bash
        run: npm run prebuild:assets:win-gpu

      - name: Build and package
        shell: bash
        run: npm run make:win-gpu

      - name: Verify Nemotron release component
        run: python scripts/verify-speaker-release.py build-assets/win-x64-gpu/nemotron/component.json

      - name: Smoke test installed Nemotron on CPU and available GPU
        run: python scripts/smoke-nemotron.py win-x64-gpu

      - name: Upload Nemotron component
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-win-x64-gpu
          path: |
            build-assets/release-components/finelistener-nemotron-*.zip
            build-assets/release-components/win-x64-gpu-nemotron-component.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finelistener-win-x64-gpu
          path: out/make/**/*
          if-no-files-found: error

  build-win-cpu:
    needs: lint-and-typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the validated Whisper source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 30c5194c9691e4e9a98b3dea9f19727397d3f46e
          path: whisper.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build whisper.cpp (CPU), miniaudio, and prepare models
        shell: bash
        run: npm run prebuild:assets:win-cpu

      - name: Build and package
        shell: bash
        run: npm run make:win-cpu

      - name: Verify Nemotron release component
        run: python scripts/verify-speaker-release.py build-assets/win-x64-cpu/nemotron/component.json

      - name: Smoke test installed Nemotron on CPU and available GPU
        run: python scripts/smoke-nemotron.py win-x64-cpu

      - name: Upload Nemotron component
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-win-x64-cpu
          path: |
            build-assets/release-components/*.zip
            build-assets/release-components/*-component.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finelistener-win-x64-cpu
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: [build-mac, build-win-gpu, build-win-cpu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify speaker release components
        run: python3 scripts/verify-speaker-release.py --all artifacts --release-tag "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
