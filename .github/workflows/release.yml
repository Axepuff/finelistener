name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Release tag differs from the application version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - name: Test release asset staging
        run: python3 -m unittest discover -s scripts -p test_stage_release.py

  build-mac:
    needs: lint-and-typecheck
    runs-on: macos-26  # Apple Silicon (arm64)
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the validated Whisper source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 30c5194c9691e4e9a98b3dea9f19727397d3f46e
          path: whisper.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build whisper.cpp (Metal) and prepare models
        run: npm run prebuild:assets:mac

      - name: Build and package
        run: npm run make:mac

      - name: Verify macOS signature and Whisper deployment targets
        run: |
          app='out/Finelistener-darwin-arm64/Finelistener.app'
          codesign --verify --deep --strict "$app"
          for binary in "$app/Contents/Resources/whisper/whisper-server" "$app/Contents/Resources/whisper/"*.dylib; do
            min_os=$(xcrun vtool -show-build "$binary" | awk '$1 == "minos" {print $2}')
            if [[ "$min_os" != '15.0' ]]; then
              echo "Unexpected macOS deployment target in $binary: $min_os" >&2
              exit 1
            fi
          done

      - name: Verify Nemotron release component
        run: python scripts/verify-speaker-release.py build-assets/mac-arm64/nemotron/component.json

      # The hosted VM's paravirtualized Metal driver crashes upstream inference; qualify Metal on a physical Mac.
      - name: Smoke test installed Nemotron on CPU
        run: python scripts/smoke-nemotron.py mac-arm64 --cpu-only

      - name: Upload Nemotron component
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-mac-arm64
          path: |
            build-assets/release-components/*.zip
            build-assets/release-components/*-component.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finelistener-mac-arm64
          path: out/make/**/*
          if-no-files-found: error

  build-win-gpu:
    needs: lint-and-typecheck
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the validated Whisper source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 30c5194c9691e4e9a98b3dea9f19727397d3f46e
          path: whisper.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: '["nvcc", "cudart", "thrust", "cublas", "cublas_dev"]'

      - name: Fetch the pinned CUDA license
        run: |
          $license = Join-Path $env:RUNNER_TEMP 'CUDA-EULA.pdf'
          Invoke-WebRequest 'https://docs.nvidia.com/cuda/archive/12.4.0/pdf/EULA.pdf' -OutFile $license
          if ((Get-FileHash $license -Algorithm SHA256).Hash -ne '6ADA441AE5A45A4A3D51ADE8850FA2229FC6DD95DE0C9DA6E2CDD7A46701B844') {
            throw 'CUDA license integrity check failed'
          }
          "CUDA_LICENSE=$license" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.328.1/windows/vulkan_sdk.exe' -OutFile $installer
          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK installation failed' }
          foreach ($file in @('Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib', 'Bin/glslc.exe')) {
            if (!(Test-Path (Join-Path $sdkRoot $file))) { throw "Missing Vulkan SDK file: $file" }
          }
          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "$sdkRoot/Bin" >> $env:GITHUB_PATH

      - name: Select the CUDA-compatible C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.29'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Prepare Nemotron before compiling Whisper
        run: python scripts/prepare-nemotron.py win-x64-gpu

      - name: Verify Nemotron release component
        run: python scripts/verify-speaker-release.py build-assets/win-x64-gpu/nemotron/component.json

      - name: Smoke test installed Nemotron on CPU and available GPU
        run: python scripts/smoke-nemotron.py win-x64-gpu

      - name: Restore the pinned Whisper GPU build
        id: whisper-gpu-cache
        uses: actions/cache/restore@v4
        with:
          path: build-assets/win-x64-gpu/whisper
          key: whisper-gpu-v1-30c5194c-msvc142-cuda124-vulkan143281-${{ hashFiles('scripts/build-whisper.sh', 'scripts/patch-whisper-timestamps.cjs') }}

      - name: Build whisper.cpp (CUDA+Vulkan)
        if: steps.whisper-gpu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          # CUDA 12.4 supports MSVC 192x/193x; the runner's default 194x compiler is newer.
          CMAKE_GENERATOR: Ninja
          CC: cl
          CXX: cl
          # Upstream templates repeat unused-variable and intentional infinity-conversion warnings for every GPU architecture.
          CUDAFLAGS: --diag-suppress=177,221,550
        run: bash scripts/build-whisper.sh win-x64-gpu

      - name: Cache the completed Whisper GPU build
        if: steps.whisper-gpu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-assets/win-x64-gpu/whisper
          key: ${{ steps.whisper-gpu-cache.outputs.cache-primary-key }}

      - name: Build miniaudio and prepare Whisper models
        shell: bash
        run: bash scripts/build-miniaudio.sh win-x64-gpu && bash scripts/prepare-models.sh

      - name: Bundle Windows runtime dependencies
        run: python scripts/prepare-windows-runtime.py win-x64-gpu --cuda-license "$env:CUDA_LICENSE"

      - name: Build and package
        shell: bash
        run: npm run make:win-gpu

      - name: Check packaged Whisper without developer PATH
        run: python scripts/smoke-whisper.py out/Finelistener-win32-x64/resources/whisper out/Finelistener-win32-x64/resources/models/ggml-base.bin --require-no-nvidia-driver

      - name: Upload Nemotron component
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-win-x64-gpu
          path: |
            build-assets/release-components/finelistener-nemotron-*.zip
            build-assets/release-components/win-x64-gpu-nemotron-component.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finelistener-win-x64-gpu
          path: out/make/**/*
          if-no-files-found: error

  build-win-cpu:
    needs: lint-and-typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the validated Whisper source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 30c5194c9691e4e9a98b3dea9f19727397d3f46e
          path: whisper.cpp

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build whisper.cpp (CPU), miniaudio, and prepare models
        shell: bash
        run: npm run prebuild:assets:win-cpu

      - name: Build and package
        shell: bash
        run: npm run make:win-cpu

      - name: Check packaged Whisper without developer PATH
        run: python scripts/smoke-whisper.py out/Finelistener-win32-x64/resources/whisper out/Finelistener-win32-x64/resources/models/ggml-base.bin

      - name: Verify Nemotron release component
        run: python scripts/verify-speaker-release.py build-assets/win-x64-cpu/nemotron/component.json

      - name: Smoke test installed Nemotron on CPU and available GPU
        run: python scripts/smoke-nemotron.py win-x64-cpu

      - name: Upload Nemotron component
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-win-x64-cpu
          path: |
            build-assets/release-components/*.zip
            build-assets/release-components/*-component.json
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finelistener-win-x64-cpu
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: [build-mac, build-win-gpu, build-win-cpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '{finelistener,nemotron}-*'
          path: artifacts

      - name: Verify speaker release components
        run: python3 scripts/verify-speaker-release.py --all artifacts

      - name: Stage downloads and checksums
        run: python3 scripts/stage-release.py artifacts release-assets

      - name: Upload staged release
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          overwrite: true
          compression-level: 0
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FineListener ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
